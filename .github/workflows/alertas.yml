name: Alertas meteorológicas CABA

on:
  schedule:
           - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal · prueba · simulacro · perspectiva · seguimiento"
        required: true
        default: normal
        type: choice
        options: [normal, prueba, simulacro, perspectiva, seguimiento]
  push:
    branches: [main]
    paths: ["docs/**", "config.yaml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - run: mkdir -p estado docs/data

      - name: Evaluar alertas y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python alertas.py --modo "${{ inputs.modo || 'normal' }}"

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.modo || inputs.modo == 'normal' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.modo || inputs.modo == 'normal' }}
        with:
          path: docs
      - id: deploy
        if: ${{ !inputs.modo || inputs.modo == 'normal' }}
        uses: actions/deploy-pages@v4
