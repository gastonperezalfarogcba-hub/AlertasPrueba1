# =====================================================================
#  Alertas meteorológicas CABA · Configuración
#  GCBA · Jefatura de Gabinete de Ministros
#
#  Todo lo que está acá se puede cambiar sin tocar el código.
#  Después de editar, hacé commit y el próximo ciclo ya usa los valores nuevos.
#  El tablero lee estos mismos umbrales (vía docs/data/alertas.json).
# =====================================================================

general:
  nombre: "Alertas meteorológicas CABA"
  # Horizonte que se evalúa para lluvia, viento y tormenta (horas hacia adelante)
  horizonte_horas: 48
  # Horizonte para temperaturas extremas (días hacia adelante, incluye hoy)
  horizonte_dias: 5
  # Nivel mínimo que dispara un mensaje: 1 = amarillo, 2 = naranja, 3 = rojo
  nivel_minimo_envio: 1
  # Avisar también cuando una alerta baja de nivel (además de cuando sube o aparece)
  avisar_bajas: true
  # Cantidad de ciclos seguidos sin la alerta para darla por finalizada
  # (evita mensajes de "finalizó" cuando el modelo oscila entre corridas)
  ciclos_para_cerrar: 2
  # URL pública del tablero (se agrega al final de cada mensaje)
  url_tablero: "https://gastonperezalfarogcba-hub.github.io/AlertasPrueba1/"

fuentes:
  open_meteo: true
  # Alertas oficiales del SMN en formato CAP (Common Alerting Protocol, estándar OMM)
  smn_cap: true
  smn_cap_feed: "https://ssl.smn.gob.ar/CAP/AR.php"

telegram:
  # El token y los chat_id NO van acá: se cargan como "secrets" en GitHub
  # (TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_IDS). Ver README.
  # Link público al canal o grupo donde publica el bot (lo muestra el tablero con un QR)
  url_canal: "https://t.me/alertasprueba1"
  # Nombre de usuario del bot, sin @ (para el botón "Abrir bot" del tablero)
  usuario_bot: "Alertasprueba1Bot"
  # Responder comandos /estado, /umbrales y /ayuda que le escriban al bot
  responder_comandos: true

# ---------------------------------------------------------------------
#  PERSPECTIVA EXTENDIDA (días 3 a 7)
#  Pronóstico de menor certeza: NO dispara alertas. Se muestra en el
#  tablero y se envía como resumen diario por Telegram.
#  Usa los mismos umbrales de abajo, aplicados a valores diarios.
# ---------------------------------------------------------------------
perspectiva:
  activa: true
  dias_desde: 3            # hoy = día 1
  dias_hasta: 7            # máximo 16 (Open-Meteo); más allá de 7 la confianza es baja
  resumen_diario: true     # mandar un resumen por Telegram una vez por día
  hora_resumen: 8          # hora local (0 a 23) a partir de la cual se manda
  solo_si_hay_senales: false   # true = mandar el resumen solo si hay algún fenómeno a vigilar
  prob_min_tormenta: 50    # % mínimo de probabilidad de lluvia para marcar tormenta
  prob_senal: 30           # si el ensamble da este % o más de superar amarillo, se muestra como señal aunque
                           # el modelo principal no lo vea (ver sección "probabilidad")

# ---------------------------------------------------------------------
#  WRF-SMN 4 km (modelo de alta resolución del Servicio Meteorológico Nacional)
#  Datos abiertos en AWS, sin clave. Lo descarga wrf.py una vez por hora
#  (workflow "WRF-SMN") y lo usan las alertas de lluvia, los partes de
#  seguimiento y el tablero. Celdas de 4 km: distingue mejor entre comunas
#  que Open-Meteo, aunque la ubicación exacta de una tormenta sigue siendo incierta.
# ---------------------------------------------------------------------
wrf:
  activo: true
  url_base: "https://smn-ar-wrf.s3.us-west-2.amazonaws.com/DATA/WRF/DET"
  plazo_horas: 72               # el SMN publica hasta 72 h
  radio_km: 3                   # se promedian las celdas a menos de esta distancia del centro de cada comuna
  max_antiguedad_horas: 30      # si el último ciclo es más viejo, no se usa
  descargas_simultaneas: 8

# ---------------------------------------------------------------------
#  PROBABILIDAD (modelos de ensamble)
#  Un ensamble es el mismo modelo corrido muchas veces con condiciones
#  iniciales apenas distintas. Si 40 de 100 escenarios superan el umbral,
#  la probabilidad es 40 %. Cada alerta por pronóstico lleva su probabilidad
#  y un nivel de confianza: alta (60 % o más), media (30 a 59 %), baja (menos de 30 %).
#  Aplica a lluvia, viento, calor y frío (las tormentas no se pueden medir así).
# ---------------------------------------------------------------------
probabilidad:
  activa: true
  # Modelos de ensamble de Open-Meteo, separados por coma. Si uno falla, se usan los demás.
  modelos: "ecmwf_ifs025, gfs_seamless, icon_seamless"
  # Cada cuánto se recalcula (los ensambles se actualizan cada 6 a 12 horas)
  cada_minutos: 60
  # 0 = se avisan todas las alertas por pronóstico, con su probabilidad.
  # Por ejemplo 30 = no se avisan por Telegram las que tienen menos de 30 % de llegar a amarillo
  # (se siguen viendo en el tablero). Conviene activarlo recién después de ver cómo se comporta.
  prob_minima_envio: 0

# ---------------------------------------------------------------------
#  AVISO DE LLUVIA (información, NO es una alerta)
#  Avisa cuando empieza a llover en la Ciudad aunque no haya alertas,
#  cuando se espera lluvia en la próxima hora, y cuando para.
#  Combina lo observado en Aeroparque (METAR) con el pronóstico por comuna.
# ---------------------------------------------------------------------
aviso_lluvia:
  activo: true
  mm_hora_minimo: 0.5          # mm/h en una comuna para considerar que llueve
  comunas_minimas: 2           # cuántas comunas tienen que tener lluvia (o lluvia observada en Aeroparque)
  avisar_anticipado: true      # avisar si se espera lluvia en la próxima hora
  prob_anticipado: 60          # % de probabilidad mínima para el aviso anticipado
  actualizar_cada_minutos: 60  # mientras llueve, un parte breve cada N minutos (0 = no mandar)
  avisar_cuando_para: true
  silenciar_con_seguimiento: true   # si hay seguimiento por alerta del SMN, no duplicar avisos
  estaciones_metar: [SABE, SADF, SADP, SAEZ]   # Aeroparque, San Fernando, El Palomar, Ezeiza

# ---------------------------------------------------------------------
#  SEGUIMIENTO (modo "alerta en curso")
#  Mientras haya una alerta oficial del SMN vigente para CABA, el bot manda
#  cada 30 minutos un parte con las próximas horas por comuna (Open-Meteo):
#  dónde y cuándo llueve, ráfagas, tormentas, temperatura y tendencia.
# ---------------------------------------------------------------------
seguimiento:
  activo: true
  niveles_smn: [1, 2, 3]          # 1 = amarillo, 2 = naranja, 3 = rojo
  cada_minutos: 30                # cada cuánto se manda el parte (mínimo 15)
  horas_adelante: 6               # horas de pronóstico que incluye cada parte
  inicio_anticipado_horas: 3      # empieza N horas antes del inicio de la alerta del SMN
  tambien_por_pronostico: false   # true = activarlo también con alertas propias de lluvia, viento o tormenta
  nivel_minimo_pronostico: 2      # ...desde este nivel (2 = naranja)

# ---------------------------------------------------------------------
#  UMBRALES · basados en los criterios del Sistema de Alerta Temprana
#  del SMN para la región Llanura (incluye CABA). Ver README, sección
#  "De dónde salen los umbrales". Ajustalos con el área técnica.
# ---------------------------------------------------------------------
umbrales:

  lluvia:
    # SMN: amarillo y naranja por acumulado en 12 h; rojo por acumulado en 24 h
    acumulado_12h_mm:  { amarillo: 40, naranja: 80 }
    acumulado_24h_mm:  { rojo: 150 }
    # Criterio LOCAL (no SMN): intensidad horaria, relevante para el drenaje urbano de CABA
    intensidad_horaria_mm: { amarillo: 20, naranja: 35, rojo: 60 }

  viento:
    # SMN Llanura: viento medio / ráfagas en km/h, con duración mínima
    sostenido_kmh: { amarillo: 55, naranja: 75, rojo: 90 }
    rafagas_kmh:   { amarillo: 65, naranja: 90, rojo: 110 }
    horas_minimas: 2

  tormenta:
    # Se detecta con el código de tiempo del modelo (95 tormenta, 96/99 granizo).
    # Opcional: también con energía convectiva (CAPE) y probabilidad de lluvia altas.
    usar_cape: true
    cape_minimo: 1500        # J/kg
    probabilidad_minima: 60  # %
    # Escalamiento del nivel (como el SMN: intensidad de lluvia, ráfagas y granizo)
    # granizo: false porque Open-Meteo no pronostica granizo para Sudamérica (solo para Europa Central).
    # El granizo llega por las alertas oficiales del SMN, que sí lo contemplan.
    naranja: { lluvia_12h_mm: 60, rafagas_kmh: 90, granizo: false }
    rojo:    { lluvia_12h_mm: 100, rafagas_kmh: 110 }

  calor:
    # SMN usa umbrales de Tmáx y Tmín por localidad (percentil 90) y la persistencia.
    # Valores de referencia para Buenos Aires: verificalos con el SMN.
    tmax: 32.3
    tmin: 22.0
    dias_consecutivos: { amarillo: 2, naranja: 3 }
    rojo_tmax: 38.0          # rojo: 3+ días seguidos y Tmáx igual o mayor a este valor

  frio:
    activo: true
    tmin: { amarillo: 2, naranja: 0, rojo: -3 }

